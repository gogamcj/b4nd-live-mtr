name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64${{ matrix.asio == 'on' && ', ASIO' || '' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asio: [off, on]
    steps:
      - uses: actions/checkout@v4

      - name: Download Steinberg ASIO SDK
        if: matrix.asio == 'on'
        shell: pwsh
        run: |
          # The SDK is not redistributable inside this repository; fetch it from Steinberg at build time.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile asiosdk.zip -MaximumRedirection 10
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $hdr = Get-ChildItem -Path asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $hdr) { throw "iasiodrv.h not found in the downloaded ASIO SDK" }
          $root = Split-Path (Split-Path $hdr.FullName -Parent) -Parent
          Write-Host "ASIO SDK root: $root"
          "B4ND_ASIO_SDK_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          if ('${{ matrix.asio }}' -eq 'on') {
            cmake -S . -B build -A x64 -DB4ND_ENABLE_ASIO=ON "-DB4ND_ASIO_SDK_DIR=$env:B4ND_ASIO_SDK_DIR"
          } else {
            cmake -S . -B build -A x64
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Launch app and capture UI (smoke test)
        shell: pwsh
        run: |
          $exe = "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe"
          python tools/make-test-wav.py "$PWD/test-backing.wav" --rate 44100 --seconds 20
          python tools/make-test-mid.py "$PWD/pads.mid" --bars 16
          foreach ($a in @(
              @('--screenshot','screenshot-midi.png','--size','1600x960','--module','GS@Wavetable','--midi',"$PWD/pads.mid"),
              @('--screenshot','screenshot-modules.png','--modules','--module','GS@Wavetable','--module','Spare','--midi',"$PWD/pads.mid"),
              @('--screenshot','screenshot-media.png','--size','1600x960','--media',"$PWD/test-backing.wav"),
              @('--screenshot','screenshot-edit.png','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-live.png','--live','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-audio-settings.png','--audio-settings'),
              @('--screenshot','screenshot-audio-scan.png','--audio-settings','--with-audio'))) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "screenshot run failed ($($a -join ' ')): $($p.ExitCode)" }
          }
          Get-ChildItem screenshot-*.png
          # Project package: save as, then reopen (exit code 0 means the open succeeded).
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @('--screenshot','screenshot-saved.png','--media',"$PWD/test-backing.wav",'--save-as',"$PWD/win-test.b4nd")
          if ($p.ExitCode -ne 0) { throw "save-as run failed" }
          if (-not (Test-Path "win-test.b4nd/project.db")) { throw "project.db not written" }
          if (Test-Path "win-test.b4nd/session.lock") { throw "session.lock left behind after a clean exit" }
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @('--screenshot','screenshot-reopened.png','--project',"$PWD/win-test.b4nd")
          if ($p.ExitCode -ne 0) { throw "reopen run failed" }
          Get-ChildItem win-test.b4nd/backups
          Get-ChildItem "$env:APPDATA/B4ND LIVE MTR/logs" | ForEach-Object { Get-Content $_.FullName }
          # External MIDI: Windows' built-in GS synth is a real MIDI output port (WinMM). If the runner has it,
          # the module must find it by name and report its state.
          $logs = Get-ChildItem "$env:APPDATA/B4ND LIVE MTR/logs" | ForEach-Object { Get-Content $_.FullName }
          if ($logs | Select-String -SimpleMatch "Microsoft GS Wavetable Synth" -Quiet) {
            # The port must be found by name and its state reported. The GS synth needs an audio endpoint, which
            # CI runners lack, so CANNOT OPEN is the expected honest answer there; READY where it can open.
            if ($logs | Select-String -Pattern "MIDI module 1 \(GS @ .*GS Wavetable.*\): READY" -Quiet) {
              Write-Output "GS Wavetable opened: module READY"
            } elseif ($logs | Select-String -Pattern "MIDI module 1 \(GS @ .*GS Wavetable.*\): CANNOT OPEN" -Quiet) {
              Write-Output "::warning::GS Wavetable found but cannot be opened on this runner (no audio endpoint): sending not checked on Windows"
            } else { throw "GS Wavetable port present but the module reported no state" }
          } else {
            Write-Output "::warning::No Microsoft GS Wavetable Synth on this runner: real MIDI port open not checked on Windows"
          }

      - name: VST3 host test (scanner process, blacklist, VSTi track)
        shell: pwsh
        run: |
          $exe = "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe"
          $dir = "build/src/app/B4ND_LIVE_MTR_artefacts/Release"
          if (-not (Test-Path "$dir/b4nd_plugin_scanner.exe")) { throw "plugin scanner not copied next to the app" }
          python tools/make-test-mid.py "$PWD/pads.mid" --bars 16
          $vst = "$PWD/build/tests/plugins/vst3"
          $q = { param($s) '"' + $s + '"' }   # Start-Process splits arguments with spaces
          $a = @('--screenshot','screenshot-plugins.png','--plugins',
                 '--vsti', (& $q "$vst/B4ND Test Synth.vst3"), '--vsti-midi', (& $q "$PWD/pads.mid"),
                 '--vsti', (& $q "$vst/B4ND Test Crash.vst3"), '--vsti', (& $q "$vst/B4ND Test Slow.vst3"),
                 '--save-as', (& $q "$PWD/vsti-test.b4nd"))
          $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "VSTi run failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @('--screenshot','screenshot-vsti-reopened.png','--size','1600x960','--project',(& $q "$PWD/vsti-test.b4nd"))
          if ($p.ExitCode -ne 0) { throw "VSTi reopen failed" }
          $logs = Get-ChildItem "$env:APPDATA/B4ND LIVE MTR/logs" | ForEach-Object { Get-Content $_.FullName }
          $logs | Select-String -Pattern "Plugin|PLUGIN|Plugins:" | ForEach-Object { $_.Line }
          if (-not ($logs | Select-String -Pattern "Plugin B4ND Test Synth \(B4ND Test\): LIVE CERTIFIED" -Quiet)) { throw "test synth not certified" }
          if (-not ($logs | Select-String -Pattern "Plugin BLACKLISTED: .*B4ND Test Crash" -Quiet)) { throw "crashing plugin not blacklisted" }
          if (-not ($logs | Select-String -Pattern "Plugin B4ND Test Slow \(B4ND Test\): NOT CERTIFIED" -Quiet)) { throw "slow plugin certified" }
          if (-not ($logs | Select-String -Pattern "Plugins: 2 loaded, 0 not available" -Quiet)) { throw "VSTi tracks not reloaded from the project" }

      - uses: actions/upload-artifact@v4
        with:
          name: B4ND-LIVE-MTR-windows-x64${{ matrix.asio == 'on' && '-asio' || '' }}
          path: |
            build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe
            build/src/app/B4ND_LIVE_MTR_artefacts/Release/b4nd_plugin_scanner.exe
            screenshot-*.png
            tools/make-test-wav.py
            tools/make-test-mid.py

  linux:
    name: Linux (GCC, dev check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libjack-jackd2-dev jackd2 xvfb alsa-utils

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build --output-on-failure

      - name: Launch app under Xvfb (smoke test)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" \
            --screenshot screenshot-linux.png --size 1600x960 --at 75
          test -s screenshot-linux.png

      - name: Audio device loss / reconnect test (JACK dummy 8-out device)
        run: |
          export JACK_DEFAULT_SERVER=b4ndci
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          DISPLAY=:99 "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" &
          APP=$!
          sleep 6
          pkill -f "jackd -n b4ndci"
          sleep 4
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 6
          kill $APP || true
          sleep 1
          LOG=$(ls -t ~/.config/"B4ND LIVE MTR"/logs/*.log | head -1)
          cat "$LOG"
          grep -q "Audio: running JACK / system @ 48000 Hz, 256 samples, 8 outs" "$LOG"
          grep -q "Audio: DEVICE LOST" "$LOG"
          test "$(grep -c 'Audio: running JACK / system' "$LOG")" -ge 2

      - name: Playback test (JACK dummy, 8 outputs and 2 outputs)
        run: |
          set -o pipefail
          export JACK_DEFAULT_SERVER=b4ndplay
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          python3 tools/make-test-wav.py test-backing.wav --rate 44100 --seconds 20
          for OUTS in 8 2; do
            jackd -n b4ndplay -d dummy -r 48000 -p 256 -P $OUTS -C 2 &
            sleep 3
            xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-play$OUTS.png --size 1600x960 \
              --with-audio --media test-backing.wav --play 4 | tee play$OUTS.txt
            pkill -f "jackd -n b4ndplay" || true
            sleep 2
          done
          peak() { grep "^output $2 " "$1" | sed 's/.*peak //'; }
          gt() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a > b) }'; }
          lt() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a < b) }'; }
          grep -q "media: 1 ready" play8.txt
          grep -q "play: engine active" play8.txt
          # 8 outputs: MR (-6/-12 dBFS sines) on OUT1/2, click on OUT3 and in-ear 7/8, nothing else.
          gt "$(peak play8.txt 1)" 0.45 && lt "$(peak play8.txt 1)" 0.55
          gt "$(peak play8.txt 2)" 0.20 && lt "$(peak play8.txt 2)" 0.30
          gt "$(peak play8.txt 3)" 0.05
          test "$(peak play8.txt 4)" = "0.0000"
          test "$(peak play8.txt 5)" = "0.0000"
          gt "$(peak play8.txt 7)" 0.05
          # 2 outputs (UR22C split): OUT1 = MR mono sum to the PA, OUT2 = click in-ear.
          grep -q "output 1 \[MAIN MONO\]" play2.txt
          gt "$(peak play2.txt 1)" 0.30 && lt "$(peak play2.txt 1)" 0.40
          gt "$(peak play2.txt 2)" 0.05
          grep -q "DSP overloads 0" play8.txt
          grep -q "DSP overloads 0" play2.txt

      - name: Project save / reopen / crash recovery test
        run: |
          set -o pipefail
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          python3 tools/make-test-wav.py test-backing.wav --rate 44100 --seconds 5
          python3 tools/make-test-mid.py pads.mid --bars 16
          # 1. demo setlist + an audio file + a sound module and a .mid track, saved as a new package (Korean name on purpose)
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-save.png --media test-backing.wav \
            --module "INTEGRA-7" --midi pads.mid --save-as "$PWD/공연 테스트.b4nd" | tee save.txt
          grep -q "project save-as: ok" save.txt
          test -f "공연 테스트.b4nd/project.db"
          test ! -e "공연 테스트.b4nd/session.lock"
          # 2. reopen: same songs, track state and media
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-open.png --project "$PWD/공연 테스트.b4nd" | tee open.txt
          grep -q 'project: "공연 테스트" (3 songs), previous session closed cleanly: yes' open.txt
          grep -q 'track "Original Mix" AUDIO 0.0 dB MUTE' open.txt
          grep -q 'track "test-backing" AUDIO 0.0 dB media=test-backing.wav' open.txt
          grep -q "media: 1 ready" open.txt
          grep -q 'module "INTEGRA-7" port "" ch 1' open.txt
          grep -q 'ext midi track "pads": pads.mid, 48 notes, module assigned' open.txt
          # 3. normal start reopens the last project; kill -9 leaves session.lock -> detected on next open
          Xvfb :98 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          XVFB=$!
          sleep 1
          DISPLAY=:98 "$APP" &
          APPPID=$!
          sleep 6
          test -e "공연 테스트.b4nd/session.lock"
          kill -9 $APPPID
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-crash.png --project "$PWD/공연 테스트.b4nd" | tee crash.txt
          grep -q "previous session closed cleanly: NO" crash.txt
          ls "공연 테스트.b4nd/backups"
          kill $XVFB || true

      - name: VST3 instrument test (scanner process, JACK dummy playback, save / reopen)
        run: |
          set -o pipefail
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          VST="$PWD/build/tests/plugins/vst3"
          test -x "$(dirname "$APP")/b4nd_plugin_scanner"
          python3 tools/make-test-mid.py pads.mid --bars 16
          export JACK_DEFAULT_SERVER=b4ndvst
          jackd -n b4ndvst -d dummy -r 48000 -p 256 -P 2 -C 2 &
          sleep 3
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-vsti.png --size 1600x960 --with-audio \
            --vsti "$VST/B4ND Test Synth.vst3" --vsti-midi pads.mid --vsti "$VST/B4ND Test Crash.vst3" \
            --at 3.5 --play 4 --save-as "$PWD/vsti.b4nd" | tee vsti.txt
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-vsti-reopened.png --with-audio \
            --project "$PWD/vsti.b4nd" --at 3.5 --play 4 | tee vsti2.txt
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-plugins.png --plugins | tee plugins.txt
          pkill -f "jackd -n b4ndvst" || true
          peak() { grep "^output $2 " "$1" | sed 's/.*peak //'; }
          gt() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a > b) }'; }
          grep -q "vsti scan B4ND Test Crash.vst3: crashed while loading" vsti.txt
          grep -q 'B4ND Test Synth \[READY\], 48 notes' vsti.txt
          grep -q "play: engine active" vsti.txt
          # The synth is on the Main bus: heard on OUT1 (PA). OUT2 (in-ear) keeps only the click.
          gt "$(peak vsti.txt 1)" 0.1
          grep -q "instrument events dropped 0, notes still on after stop 0" vsti.txt
          grep -q "DSP overloads 0" vsti.txt
          # Reopened: plugin reloaded with its saved state and plays again
          grep -qE 'B4ND Test Synth \[READY\], 48 notes, state [1-9][0-9]* bytes' vsti2.txt
          gt "$(peak vsti2.txt 1)" 0.1
          grep -q "notes still on after stop 0" vsti2.txt
          # Plugin missing on "another computer": status shown, saved state kept on save
          mv "$VST/B4ND Test Synth.vst3" "$VST/hidden"
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-vsti-missing.png --live \
            --project "$PWD/vsti.b4nd" | tee missing.txt
          mv "$VST/hidden" "$VST/B4ND Test Synth.vst3"
          grep -qE 'B4ND Test Synth \[PLUGIN MISSING\].*state [1-9][0-9]* bytes' missing.txt

      - name: External MIDI test (engine -> MIDI thread -> ALSA virtual MIDI port)
        run: |
          set -o pipefail
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          python3 tools/make-test-mid.py pads.mid --bars 16
          # A virtual MIDI port in the kernel, so the real ALSA output path is used (best effort: runner kernels vary).
          PORT=""
          if sudo modprobe snd-virmidi midi_devs=1 2>/dev/null \
             || (sudo apt-get install -y "linux-modules-extra-$(uname -r)" > /dev/null 2>&1 && sudo modprobe snd-virmidi midi_devs=1); then
            sleep 1
            sudo chmod a+rw /dev/snd/* || true
            amidi -l || true
            PORT=$(amidi -l | awk '/Vir/ { print $2; exit }')
          fi
          export JACK_DEFAULT_SERVER=b4ndmidi
          jackd -n b4ndmidi -d dummy -r 48000 -p 256 -P 2 -C 2 &
          sleep 3
          MOD="Pads"
          if [ -n "$PORT" ]; then
            amidi -p "$PORT" -r midi-in.bin -t 8 &
            DUMP=$!
            MOD="Pads@Vir"
          else
            echo "::warning::snd-virmidi not available on this runner: MIDI bytes on the wire not checked (engine path only)"
          fi
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-midi.png --size 1600x960 \
            --with-audio --module "$MOD" --midi pads.mid --at 3.5 --play 4 | tee midi.txt
          pkill -f "jackd -n b4ndmidi" || true
          grep -q 'ext midi track "pads": pads.mid, 48 notes, module assigned' midi.txt
          grep -q "play: engine active" midi.txt
          grep -q "engine queue full 0, notes still on after stop 0" midi.txt
          if [ -n "$PORT" ]; then
            wait $DUMP || true
            grep -qE 'module "Pads" port ".*Vir.*" ch 1: READY' midi.txt
            grep -q "late 0 (>2 ms)" midi.txt
            python3 - midi-in.bin <<'PY'
          import sys
          data = open(sys.argv[1], "rb").read()
          msgs, status, i = [], 0, 0
          while i < len(data):
              b = data[i]
              if b >= 0x80:
                  status, i = b, i + 1
              n = 1 if (status & 0xF0) in (0xC0, 0xD0) else 2
              msgs.append((status, *data[i:i + n])); i += n
          on = {}
          ons = 0
          for m in msgs:
              if m[0] & 0xF0 == 0x90 and m[2] > 0:
                  on[(m[0] & 15, m[1])] = True; ons += 1
              elif m[0] & 0xF0 == 0x80 or (m[0] & 0xF0 == 0x90 and m[2] == 0):
                  on.pop((m[0] & 15, m[1]), None)
          print(f"{len(msgs)} messages, {ons} note-ons, still sounding: {sorted(on)}")
          assert (0xC0, 12) in msgs, "program change of the module preset missing"
          assert ons >= 6, "too few notes reached the port"
          assert not on, "hanging notes after stop"
          assert any(m[0] == 0xB0 and m[1] == 123 for m in msgs), "All Notes Off missing after stop"
          PY
          fi
