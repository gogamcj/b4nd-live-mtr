name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Launch app and capture UI (smoke test)
        shell: pwsh
        run: |
          $exe = "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshot','screenshot-edit.png','--size','1600x960','--at','75' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "edit screenshot failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList '--screenshot','screenshot-live.png','--live','--size','1600x960','--at','75' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "live screenshot failed: $($p.ExitCode)" }
          Get-ChildItem screenshot-*.png

      - uses: actions/upload-artifact@v4
        with:
          name: B4ND-LIVE-MTR-windows-x64
          path: |
            build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe
            screenshot-*.png

  linux:
    name: Linux (GCC, dev check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Core unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Launch app under Xvfb (smoke test)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" \
            --screenshot screenshot-linux.png --size 1600x960 --at 75
          test -s screenshot-linux.png
