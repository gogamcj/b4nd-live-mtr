name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64${{ matrix.asio == 'on' && ', ASIO' || '' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asio: [off, on]
    steps:
      - uses: actions/checkout@v4

      - name: Download Steinberg ASIO SDK
        if: matrix.asio == 'on'
        shell: pwsh
        run: |
          # The SDK is not redistributable inside this repository; fetch it from Steinberg at build time.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile asiosdk.zip -MaximumRedirection 10
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $hdr = Get-ChildItem -Path asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $hdr) { throw "iasiodrv.h not found in the downloaded ASIO SDK" }
          $root = Split-Path (Split-Path $hdr.FullName -Parent) -Parent
          Write-Host "ASIO SDK root: $root"
          "B4ND_ASIO_SDK_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          if ('${{ matrix.asio }}' -eq 'on') {
            cmake -S . -B build -A x64 -DB4ND_ENABLE_ASIO=ON "-DB4ND_ASIO_SDK_DIR=$env:B4ND_ASIO_SDK_DIR"
          } else {
            cmake -S . -B build -A x64
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Launch app and capture UI (smoke test)
        shell: pwsh
        run: |
          $exe = "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe"
          foreach ($a in @(
              @('--screenshot','screenshot-edit.png','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-live.png','--live','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-audio-settings.png','--audio-settings'),
              @('--screenshot','screenshot-audio-scan.png','--audio-settings','--with-audio'))) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "screenshot run failed ($($a -join ' ')): $($p.ExitCode)" }
          }
          Get-ChildItem screenshot-*.png
          Get-ChildItem "$env:APPDATA/B4ND LIVE MTR/logs" | ForEach-Object { Get-Content $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: B4ND-LIVE-MTR-windows-x64${{ matrix.asio == 'on' && '-asio' || '' }}
          path: |
            build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe
            screenshot-*.png

  linux:
    name: Linux (GCC, dev check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libjack-jackd2-dev jackd2 xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build --output-on-failure

      - name: Launch app under Xvfb (smoke test)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" \
            --screenshot screenshot-linux.png --size 1600x960 --at 75
          test -s screenshot-linux.png

      - name: Audio device loss / reconnect test (JACK dummy 8-out device)
        run: |
          export JACK_DEFAULT_SERVER=b4ndci
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          DISPLAY=:99 "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" &
          APP=$!
          sleep 6
          pkill -f "jackd -n b4ndci"
          sleep 4
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 6
          kill $APP || true
          sleep 1
          LOG=$(ls -t ~/.config/"B4ND LIVE MTR"/logs/*.log | head -1)
          cat "$LOG"
          grep -q "Audio: running JACK / system @ 48000 Hz, 256 samples, 8 outs" "$LOG"
          grep -q "Audio: DEVICE LOST" "$LOG"
          test "$(grep -c 'Audio: running JACK / system' "$LOG")" -ge 2
