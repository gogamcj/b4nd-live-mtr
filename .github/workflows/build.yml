name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC x64${{ matrix.asio == 'on' && ', ASIO' || '' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asio: [off, on]
    steps:
      - uses: actions/checkout@v4

      - name: Download Steinberg ASIO SDK
        if: matrix.asio == 'on'
        shell: pwsh
        run: |
          # The SDK is not redistributable inside this repository; fetch it from Steinberg at build time.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://www.steinberg.net/asiosdk' -OutFile asiosdk.zip -MaximumRedirection 10
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $hdr = Get-ChildItem -Path asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if (-not $hdr) { throw "iasiodrv.h not found in the downloaded ASIO SDK" }
          $root = Split-Path (Split-Path $hdr.FullName -Parent) -Parent
          Write-Host "ASIO SDK root: $root"
          "B4ND_ASIO_SDK_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          if ('${{ matrix.asio }}' -eq 'on') {
            cmake -S . -B build -A x64 -DB4ND_ENABLE_ASIO=ON "-DB4ND_ASIO_SDK_DIR=$env:B4ND_ASIO_SDK_DIR"
          } else {
            cmake -S . -B build -A x64
          }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Launch app and capture UI (smoke test)
        shell: pwsh
        run: |
          $exe = "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe"
          python tools/make-test-wav.py "$PWD/test-backing.wav" --rate 44100 --seconds 20
          foreach ($a in @(
              @('--screenshot','screenshot-media.png','--size','1600x960','--media',"$PWD/test-backing.wav"),
              @('--screenshot','screenshot-edit.png','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-live.png','--live','--size','1600x960','--at','75'),
              @('--screenshot','screenshot-audio-settings.png','--audio-settings'),
              @('--screenshot','screenshot-audio-scan.png','--audio-settings','--with-audio'))) {
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "screenshot run failed ($($a -join ' ')): $($p.ExitCode)" }
          }
          Get-ChildItem screenshot-*.png
          # Project package: save as, then reopen (exit code 0 means the open succeeded).
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @('--screenshot','screenshot-saved.png','--media',"$PWD/test-backing.wav",'--save-as',"$PWD/win-test.b4nd")
          if ($p.ExitCode -ne 0) { throw "save-as run failed" }
          if (-not (Test-Path "win-test.b4nd/project.db")) { throw "project.db not written" }
          if (Test-Path "win-test.b4nd/session.lock") { throw "session.lock left behind after a clean exit" }
          $p = Start-Process -FilePath $exe -PassThru -Wait -ArgumentList @('--screenshot','screenshot-reopened.png','--project',"$PWD/win-test.b4nd")
          if ($p.ExitCode -ne 0) { throw "reopen run failed" }
          Get-ChildItem win-test.b4nd/backups
          Get-ChildItem "$env:APPDATA/B4ND LIVE MTR/logs" | ForEach-Object { Get-Content $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: B4ND-LIVE-MTR-windows-x64${{ matrix.asio == 'on' && '-asio' || '' }}
          path: |
            build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR.exe
            screenshot-*.png
            tools/make-test-wav.py

  linux:
    name: Linux (GCC, dev check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev libjack-jackd2-dev jackd2 xvfb

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests (core + realtime engine)
        run: ctest --test-dir build --output-on-failure

      - name: Launch app under Xvfb (smoke test)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" \
            --screenshot screenshot-linux.png --size 1600x960 --at 75
          test -s screenshot-linux.png

      - name: Audio device loss / reconnect test (JACK dummy 8-out device)
        run: |
          export JACK_DEFAULT_SERVER=b4ndci
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 3
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 1
          DISPLAY=:99 "build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR" &
          APP=$!
          sleep 6
          pkill -f "jackd -n b4ndci"
          sleep 4
          jackd -n b4ndci -d dummy -r 48000 -p 256 -P 8 -C 2 &
          sleep 6
          kill $APP || true
          sleep 1
          LOG=$(ls -t ~/.config/"B4ND LIVE MTR"/logs/*.log | head -1)
          cat "$LOG"
          grep -q "Audio: running JACK / system @ 48000 Hz, 256 samples, 8 outs" "$LOG"
          grep -q "Audio: DEVICE LOST" "$LOG"
          test "$(grep -c 'Audio: running JACK / system' "$LOG")" -ge 2

      - name: Playback test (JACK dummy, 8 outputs and 2 outputs)
        run: |
          set -o pipefail
          export JACK_DEFAULT_SERVER=b4ndplay
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          python3 tools/make-test-wav.py test-backing.wav --rate 44100 --seconds 20
          for OUTS in 8 2; do
            jackd -n b4ndplay -d dummy -r 48000 -p 256 -P $OUTS -C 2 &
            sleep 3
            xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot screenshot-play$OUTS.png --size 1600x960 \
              --with-audio --media test-backing.wav --play 4 | tee play$OUTS.txt
            pkill -f "jackd -n b4ndplay" || true
            sleep 2
          done
          peak() { grep "^output $2 " "$1" | sed 's/.*peak //'; }
          gt() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a > b) }'; }
          lt() { awk -v a="$1" -v b="$2" 'BEGIN { exit !(a < b) }'; }
          grep -q "media: 1 ready" play8.txt
          grep -q "play: engine active" play8.txt
          # 8 outputs: MR (-6/-12 dBFS sines) on OUT1/2, click on OUT3 and in-ear 7/8, nothing else.
          gt "$(peak play8.txt 1)" 0.45 && lt "$(peak play8.txt 1)" 0.55
          gt "$(peak play8.txt 2)" 0.20 && lt "$(peak play8.txt 2)" 0.30
          gt "$(peak play8.txt 3)" 0.05
          test "$(peak play8.txt 4)" = "0.0000"
          test "$(peak play8.txt 5)" = "0.0000"
          gt "$(peak play8.txt 7)" 0.05
          # 2 outputs (UR22C split): OUT1 = MR mono sum to the PA, OUT2 = click in-ear.
          grep -q "output 1 \[MAIN MONO\]" play2.txt
          gt "$(peak play2.txt 1)" 0.30 && lt "$(peak play2.txt 1)" 0.40
          gt "$(peak play2.txt 2)" 0.05
          grep -q "DSP overloads 0" play8.txt
          grep -q "DSP overloads 0" play2.txt

      - name: Project save / reopen / crash recovery test
        run: |
          set -o pipefail
          APP="$PWD/build/src/app/B4ND_LIVE_MTR_artefacts/Release/B4ND LIVE MTR"
          python3 tools/make-test-wav.py test-backing.wav --rate 44100 --seconds 5
          # 1. demo setlist + an audio file, saved as a new project package (Korean name on purpose)
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-save.png --media test-backing.wav \
            --save-as "$PWD/공연 테스트.b4nd" | tee save.txt
          grep -q "project save-as: ok" save.txt
          test -f "공연 테스트.b4nd/project.db"
          test ! -e "공연 테스트.b4nd/session.lock"
          # 2. reopen: same songs, track state and media
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-open.png --project "$PWD/공연 테스트.b4nd" | tee open.txt
          grep -q 'project: "공연 테스트" (3 songs), previous session closed cleanly: yes' open.txt
          grep -q 'track "Original Mix" AUDIO 0.0 dB MUTE' open.txt
          grep -q 'track "test-backing" AUDIO 0.0 dB media=test-backing.wav' open.txt
          grep -q "media: 1 ready" open.txt
          # 3. normal start reopens the last project; kill -9 leaves session.lock -> detected on next open
          Xvfb :98 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          XVFB=$!
          sleep 1
          DISPLAY=:98 "$APP" &
          APPPID=$!
          sleep 6
          test -e "공연 테스트.b4nd/session.lock"
          kill -9 $APPPID
          xvfb-run -a -s "-screen 0 1920x1080x24" "$APP" --screenshot shot-crash.png --project "$PWD/공연 테스트.b4nd" | tee crash.txt
          grep -q "previous session closed cleanly: NO" crash.txt
          ls "공연 테스트.b4nd/backups"
          kill $XVFB || true

      - name: Verify vendored SQLite is the official release
        run: |
          curl -fsSL -o sqlite.zip https://www.sqlite.org/2026/sqlite-amalgamation-3540100.zip
          unzip -q sqlite.zip -d sqlite-official
          cmp sqlite-official/sqlite-amalgamation-3540100/sqlite3.c third_party/sqlite/sqlite3.c
          cmp sqlite-official/sqlite-amalgamation-3540100/sqlite3.h third_party/sqlite/sqlite3.h
          echo "third_party/sqlite matches sqlite.org 3.54.1"
